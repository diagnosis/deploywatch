name: mobile_flutter
description: Monitor your GitHub repos in real time.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Navigation ──────────────────────────────────────────────
  go_router: ^14.0.0

  # ── State management ────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── HTTP ────────────────────────────────────────────────────
  dio: ^5.4.3
  http: ^1.2.0
  url_launcher: ^6.3.0
  # ── Secure storage ──────────────────────────────────────────
  flutter_secure_storage: ^9.2.2

  # ── Auth / OAuth ────────────────────────────────────────────
  flutter_web_auth_2: ^4.0.0

  # ── Push notifications ───────────────────────────────────────
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0

  # ── UI ──────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8

  # ── Utilities ───────────────────────────────────────────────
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  shared_preferences: ^2.0.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  riverpod_generator: ^2.4.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
flutter_native_splash:
  color: "#080D12"
  image: assets/images/splash_icon.png
  color_dark: "#080D12"
  image_dark: assets/images/splash_icon.png
  android: true
  ios: true
  fullscreen: true
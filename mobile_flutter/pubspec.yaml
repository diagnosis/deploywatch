name: mobile_flutter
description: Monitor your GitHub repos in real time.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Navigation ──────────────────────────────────────────────
  go_router: ^14.0.0

  # ── State management ────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── HTTP ────────────────────────────────────────────────────
  dio: ^5.4.3
  http: ^1.2.0

  # ── Secure storage ──────────────────────────────────────────
  flutter_secure_storage: ^9.2.2

  # ── Auth / OAuth ────────────────────────────────────────────
  flutter_web_auth_2: ^4.0.0

  # ── Push notifications ───────────────────────────────────────
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0

  # ── UI ──────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8

  # ── Utilities ───────────────────────────────────────────────
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  riverpod_generator: ^2.4.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true